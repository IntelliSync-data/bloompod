<!DOCTYPE html>
<html lang="en" ready="true">

<head>

        window.addEventListener("message", (message) => {

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Bloompod™ - Language Readiness System</title>
    <meta name="description" content="Bloompod™ - Language Readiness System for children 0-3 years old">
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="./assets/css/globals.css">
    <link rel="stylesheet" href="./assets/css/styleguide.css">
    <link rel="stylesheet" href="./assets/css/style.css?v=9">
    <link rel="stylesheet" href="./assets/css/style-responsive.css">
    <link rel="stylesheet" href="./assets/css/order.css?v=1">
    <script src="https://app.bloompod.vn/chatbot/widget.js?lang=en"></script>
</head>

<body style="user-select: unset;">
    <script src="./assets/js/toast.js"></script>
    <script src="./assets/js/lang.js"></script>
    <script src="./assets/js/order.js?v=1"></script>
    <script>
        // Smooth scroll for anchor links
        document.addEventListener('DOMContentLoaded', function () {
            // Smooth scrolling
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href === '#' || !href) return;

                    e.preventDefault();
                    const target = document.querySelector(href);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });

                        // Close mobile menu if open
                        const mobileMenu = document.getElementById('mobile-menu');
                        if (mobileMenu && mobileMenu.classList.contains('active')) {
                            mobileMenu.classList.remove('active');
                            document.body.style.overflow = '';
                        }
                    }
                });
            });

            // Mobile menu toggle
            const hamburger = document.getElementById('hamburger-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const mobileMenuClose = document.getElementById('mobile-menu-close');

            if (hamburger && mobileMenu) {
                hamburger.addEventListener('click', function () {
                    mobileMenu.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            }

            if (mobileMenuClose && mobileMenu) {
                mobileMenuClose.addEventListener('click', function () {
                    mobileMenu.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }

            // Highlight active nav link
            const sections = document.querySelectorAll('section[id]');
            const navLinks = document.querySelectorAll('.menu-tab, .mobile-nav-link');

            function highlightNav() {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    const sectionHeight = section.clientHeight;
                    if (window.pageYOffset >= sectionTop - 200) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            }

            window.addEventListener('scroll', highlightNav);
            highlightNav();

            // Form validation is handled in order.js

            // Video play button
            const playButtons = document.querySelectorAll('.play-pause');
            playButtons.forEach(btn => {
                btn.addEventListener('click', function () {
                    alert('Video player would open here');
                    // In a real app, you would open a video modal or player
                });
            });

            // Modal close buttons
            const modalCloseButtons = document.querySelectorAll('.frame-97, .button-13');
            modalCloseButtons.forEach(btn => {
                btn.addEventListener('click', function () {
                    const modal = this.closest('.cm-on');
                    if (modal) {
                        modal.style.display = 'none';
                        const overlay = document.querySelector('.rectangle-5');
                        if (overlay) overlay.style.display = 'none';
                    }
                });
            });

            // Language switcher
            const langSwitcher = document.querySelectorAll('.ngn-ng');
            langSwitcher.forEach(switcher => {
                switcher.addEventListener('click', function () {
                    alert('Language switching would be implemented here');
                });
            });

            // Purchase buttons - scroll to form or show modal
            const purchaseButtons = document.querySelectorAll('.button, .button-wrapper, .button-5, .button-6');
            purchaseButtons.forEach(btn => {
                const text = btn.textContent.trim();
                if (text.includes('Order') || text.includes('Bloom')) {
                    btn.addEventListener('click', function (e) {
                        e.preventDefault();
                        // Scroll to order form or show purchase modal
                        const orderSection = document.querySelector('.info-wrapper');
                        if (orderSection) {
                            orderSection.scrollIntoView({ behavior: 'smooth' });
                        }
                    });
                }
            });
        });
    </script>
    <main class="main">
        <section class="home">
            <!-- Menu dùng chung: sửa ở partials/header-en.html -->
            <div data-site-header data-hide-if-param="gift">
                <noscript>
                    <a href="index-en.html">Home</a>
                    <a href="give-a-gift-en.html">Give a Gift</a>
                    <a href="index-en.html#book-sharing">Download Language Readiness Book</a>
                    <a href="support-en.html">Support</a>
                </noscript>
            </div>

            <section class="home-wrapper-section-order-full">
                <div class="container flex-direction-column order-container">
                    <!-- STEP 1: RECIPIENT INFORMATION -->
                    <div id="step1" class="order-step active">
                        <div class="step-content">
                            <h1 class="step-title">Recipient Information</h1>
                            <p class="step-description">Please provide your information so we can prepare the gift
                                for the child you're supporting.</p>

                            <form id="orderForm" class="order-form">
                                <!-- Full Name -->
                                <div class="form-group full-width">
                                    <label for="fullName">Full Name <span class="required">*</span></label>
                                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                                        required>
                                    <span class="error-message"></span>
                                </div>

                                <!-- Phone & Email -->
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="phone">Phone Number <span class="required">*</span></label>
                                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
                                            required>
                                        <span class="error-message"></span>
                                    </div>
                                    <div class="form-group">
                                        <label for="email">Email <span class="required">*</span></label>
                                        <input type="email" id="email" name="email"
                                            placeholder="Enter your email address" required>
                                        <span class="error-message"></span>
                                    </div>
                                </div>

                                <!-- Province/Ward (bỏ cấp quận/huyện theo địa giới mới 2025) -->
                                <div class="form-row form-row-2">
                                    <div class="form-group">
                                        <label for="province">Province/City <span class="required">*</span></label>
                                        <div class="combo">
                                            <input type="text" id="province" name="province" class="combo__input"
                                                placeholder="Select Province/City" autocomplete="off" role="combobox"
                                                aria-expanded="false" aria-autocomplete="list"
                                                aria-controls="province-list" required>
                                            <input type="hidden" id="provinceCode" name="provinceCode">
                                            <ul class="combo__list" id="province-list" role="listbox" hidden></ul>
                                        </div>
                                        <span class="error-message"></span>
                                    </div>
                                    <div class="form-group">
                                        <label for="ward">Ward <span class="required">*</span></label>
                                        <div class="combo">
                                            <input type="text" id="ward" name="ward" class="combo__input"
                                                placeholder="Select Ward" autocomplete="off" role="combobox"
                                                aria-expanded="false" aria-autocomplete="list" aria-controls="ward-list"
                                                required>
                                            <input type="hidden" id="wardCode" name="wardCode">
                                            <ul class="combo__list" id="ward-list" role="listbox" hidden></ul>
                                        </div>
                                        <span class="error-message"></span>
                                    </div>
                                </div>

                                <!-- Street Address -->
                                <div class="form-group full-width">
                                    <label for="address">Street Address <span class="required">*</span></label>
                                    <input type="text" id="address" name="address"
                                        placeholder="e.g. ABC Apartment, 123 Le Loi Street" required>
                                    <span class="error-message"></span>
                                </div>

                                <!-- Old address note -->
                                <div class="form-group full-width">
                                    <label for="addressNote">Old address note (if needed)</label>
                                    <input type="text" id="addressNote" name="addressNote"
                                        placeholder="e.g. ABC Apartment, 123 Le Loi Street, District 1, Ho Chi Minh City">
                                    <span class="error-message"></span>
                                </div>

                                <!-- Baby age in months -->
                                <div class="form-group full-width">
                                    <label for="babyAge">How old is your baby? (months) <span
                                            class="required">*</span></label>
                                    <input type="number" id="babyAge" name="babyAge" placeholder="Enter age in months"
                                        min="0" max="36" required>
                                    <span class="error-message"></span>
                                </div>

                                <!-- Submit Button -->
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">Confirm & Payment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Footer dùng chung: sửa ở partials/footer-en.html -->
            <div data-site-footer data-hide-if-param="gift">
                <noscript><a href="support-en.html">Support</a></noscript>
            </div>
        </section>
    </main>
    <script src="./assets/js/site-chrome.js?v=1"></script>
</body>

</html>
